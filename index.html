<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIOSHFLEX</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e50914">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Netflix-Style Splash Intro Animation -->
  <div id="splashScreen" style="position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.6s ease; pointer-events: none;">
    <div class="splash-logo" style="font-size: 42px; font-weight: 900; color: #e50914; letter-spacing: 3px; text-shadow: 0 0 30px rgba(229,9,20,0.8); animation: splashPulse 1.2s ease-in-out infinite alternate;">KIOSHFLEX</div>
  </div>

  <header>
    <div class="nav-left">
      <button id="hamburgerBtn" class="hamburger-btn">&#9776;</button>
      <div class="logo" id="homeLogo" style="cursor: pointer;">KIOSHFLEX</div>
    </div>
    <div class="header-actions">
      <button id="watchlistNavBtn" class="header-btn">Watchlist</button>
      <button id="aiChatToggleBtn" class="header-btn" style="background:#e50914; color:#fff;">AI Chat</button>
      <button id="themeToggleBtn" class="header-btn">Theme</button>
    </div>
  </header>

  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <div id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Menu & Filters</div>
      <button id="closeSidebar" class="close-sidebar">&times;</button>
    </div>

    <div class="sidebar-group">
      <div class="sidebar-label">Content Type</div>
      <div class="type-switcher">
        <button id="btnMovies" class="type-btn active" data-type="movie">Movies</button>
        <button id="btnTV" class="type-btn" data-type="tv">TV Series</button>
      </div>
    </div>

    <div class="sidebar-group">
      <div class="sidebar-label">Genre</div>
      <select id="genreSelect">
        <option value="">All Genres</option>
        <option value="28">Action</option>
        <option value="12">Adventure</option>
        <option value="16">Animation</option>
        <option value="35">Comedy</option>
        <option value="80">Crime</option>
        <option value="18">Drama</option>
        <option value="14">Fantasy</option>
        <option value="27">Horror</option>
        <option value="9648">Mystery</option>
        <option value="10749">Romance</option>
        <option value="878">Sci-Fi</option>
        <option value="53">Thriller</option>
      </select>
    </div>

    <div class="sidebar-group">
      <div class="sidebar-label">Language</div>
      <select id="languageSelect">
        <option value="">All Languages</option>
        <option value="en">English</option>
        <option value="tl">Tagalog / Filipino</option>
        <option value="ko">Korean</option>
        <option value="ja">Japanese</option>
        <option value="es">Spanish</option>
        <option value="zh">Chinese</option>
      </select>
    </div>

    <div class="sidebar-group">
      <div class="sidebar-label">Sort By</div>
      <select id="sortSelect">
        <option value="popularity.desc">Most Popular</option>
        <option value="vote_average.desc">Highest Rated</option>
        <option value="primary_release_date.desc">Latest Release</option>
      </select>
    </div>

    <div class="sidebar-group">
      <div class="sidebar-label">Year</div>
      <select id="yearSelect">
        <option value="">All Years</option>
      </select>
    </div>
  </div>

  <div class="search-container" style="position: relative; display: flex; gap: 8px; align-items: center;">
    <div class="search-wrapper" style="position: relative; flex: 1; display: flex; align-items: center; background-color: #121212; border: 1px solid #27272a; border-radius: 9999px; padding: 6px 16px;">
      <svg style="width: 18px; height: 18px; fill: none; stroke: #a1a1aa; stroke-width: 2; margin-right: 10px; flex-shrink: 0;" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="Search movies, TV shows..." autocomplete="off" style="background: transparent; border: none; outline: none; color: #fff; width: 100%; font-size: 14px;">
      
      <div id="searchDropdownWrapper" style="position: absolute; top: calc(100% + 8px); left: 0; right: 0; background-color: #121212; border: 1px solid #27272a; border-radius: 16px; padding: 12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.7); z-index: 50; display: none; flex-direction: column; gap: 8px;">
        <div id="historyHeader" style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #a1a1aa; padding: 0 4px;">
          <span>Recent Searches</span>
          <button id="clearHistoryBtn" style="background: transparent !important; border: none !important; color: #a1a1aa; cursor: pointer; font-size: 12px; font-weight: 500; padding: 0;">Clear All</button>
        </div>
        <div id="searchHistoryContainer" style="display: flex; gap: 6px; flex-wrap: wrap;"></div>
        <div id="suggestionsBox" class="suggestions-dropdown" style="position: static; border: none; box-shadow: none; width: 100%; background: transparent; padding: 0;"></div>
      </div>
    </div>
    <button id="searchBtn" style="background-color: #dc2626; color: #fff; border: none; border-radius: 9999px; padding: 10px 20px; font-weight: 500; cursor: pointer;">Search</button>
  </div>

  <!-- AI Chat Box Floating UI -->
  <div id="aiChatBox" style="position: fixed; bottom: 20px; right: 20px; width: 320px; height: 400px; background: #121212; border: 1px solid #27272a; border-radius: 12px; display: none; flex-direction: column; z-index: 10000; box-shadow: 0 10px 25px rgba(0,0,0,0.8);">
    <div style="padding: 10px 14px; background: #18181b; border-top-left-radius: 12px; border-top-right-radius: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #27272a;">
      <span style="color: #fff; font-weight: bold; font-size: 13px;">KIOSHFLEX AI Assistant</span>
      <button id="aiChatClose" style="background: transparent; border: none; color: #aaa; font-size: 16px; cursor: pointer;">&times;</button>
    </div>
    <div id="aiChatMessages" style="flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 12px;">
      <div style="background: #222; color: #ddd; padding: 8px 12px; border-radius: 8px; align-self: flex-start; white-space: pre-wrap;">Hello! I'm your Ai Assistant. What movie do you want to watch?</div>
    </div>
    <div style="padding: 10px; border-top: 1px solid #27272a; display: flex; gap: 6px; background: #18181b; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px;">
      <input type="text" id="aiChatInput" placeholder="Ask here..." style="flex: 1; background: #121212; border: 1px solid #27272a; border-radius: 6px; padding: 6px 10px; color: #fff; font-size: 12px; outline: none;">
      <button id="aiChatSend" style="background: #e50914; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;">Send</button>
    </div>
  </div>

  <div id="heroBanner" class="hero-banner" style="display: none;">
    <div class="hero-content">
      <h2 id="heroTitle" class="hero-title">Loading Featured...</h2>
      <button id="heroPlayBtn" class="hero-btn">&#9658; Play</button>
    </div>
  </div>

  <div id="continueSection" class="carousel-section" style="display: none;">
    <div class="section-title">Continue Watching</div>
    <div id="continueCarousel" class="carousel"></div>
  </div>

  <div id="carouselSection" class="carousel-section">
    <div class="section-title">Trending Top 10</div>
    <div id="top10Carousel" class="carousel"></div>
  </div>

  <div>
    <div id="sectionTitle" class="section-title">Explore Movies</div>
    <div id="movieGrid" class="movie-grid"></div>
  </div>

  <div id="movieModal" class="modal">
    <div class="modal-content">
      <button id="closeModal" class="close-modal">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
