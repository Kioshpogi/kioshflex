<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KioshFlex - Stream Movies & TV Shows</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e50914">
  <link rel="apple-touch-icon" href="icon.png">
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="header-top">
      <div class="logo">KIOSHFLEX</div>
      <div class="header-controls">
        <button id="watchlistNavBtn" class="theme-toggle-btn">Watchlist</button>
        <button id="themeToggleBtn" class="theme-toggle-btn">Theme</button>
      </div>
    </div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search movies, TV shows...">
      <button id="searchBtn">Search</button>
    </div>
  </header>

  <!-- Category & Genre Nav -->
  <nav class="category-nav">
    <div class="type-btns">
      <button id="btnMovies" class="nav-btn active">Movies</button>
      <button id="btnTV" class="nav-btn">TV Series</button>
    </div>
    
    <div class="genre-filter">
      <select id="genreSelect">
        <option value="">All Genres</option>
        <option value="28">Action</option>
        <option value="35">Comedy</option>
        <option value="27">Horror</option>
        <option value="16">Anime / Animation</option>
      </select>
    </div>
  </nav>

  <!-- Content Container -->
  <main class="container">
    <!-- Top 10 Carousel Section -->
    <section id="carouselSection" class="carousel-section">
      <h2>🔥 Top 10 Trending This Week</h2>
      <div class="carousel-container" id="top10Carousel"></div>
    </section>

    <h2 id="sectionTitle">Trending Movies</h2>
    <div id="movieGrid" class="movie-grid"></div>
  </main>

  <!-- Player Modal -->
  <div id="movieModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
