<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIOSHFLEX</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e50914">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --bg-color: #141414;
      --text-color: #ffffff;
      --card-bg: #1f1f1f;
      --accent-color: #e50914;
      --nav-bg: rgba(20, 20, 20, 0.95);
    }

    body.light-mode {
      --bg-color: #f4f4f4;
      --text-color: #111111;
      --card-bg: #e2e2e2;
      --nav-bg: rgba(244, 244, 244, 0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 50px;
      transition: background 0.3s, color 0.3s;
    }

    /* Navbar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--nav-bg);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #hamburgerBtn {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 20px;
      cursor: pointer;
    }

    .logo {
      color: var(--accent-color);
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 1px;
    }

    .nav-right {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    /* Search Bar */
    .search-container {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
    }

    #searchInput {
      flex: 1;
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    #searchBtn {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Sidebar / Drawer */
    #sidebarOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
    }

    #sidebar {
      position: fixed;
      top: 0;
      left: -260px;
      width: 260px;
      height: 100%;
      background: var(--bg-color);
      border-right: 1px solid rgba(255,255,255,0.1);
      z-index: 201;
      transition: left 0.3s ease;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    #sidebar.open {
      left: 0;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    #closeSidebar {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 20px;
      cursor: pointer;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-group label {
      font-size: 12px;
      color: #aaa;
    }

    .filter-group select {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
    }

    .type-switch {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .type-btn {
      flex: 1;
      background: var(--card-bg);
      color: var(--text-color);
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .type-btn.active {
      background: var(--accent-color);
      color: #fff;
    }

    /* Hero Banner */
    #heroBanner {
      width: 100%;
      height: 220px;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 16px;
      position: relative;
    }

    #heroBanner::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--bg-color), transparent);
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    #heroTitle {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    #heroPlayBtn {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Carousels */
    .section-container {
      padding: 16px;
    }

    .section-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .carousel {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }

    .carousel::-webkit-scrollbar {
      display: none;
    }

    .carousel-card {
      min-width: 110px;
      width: 110px;
      cursor: pointer;
      position: relative;
    }

    .carousel-card img {
      width: 100%;
      height: 165px;
      object-fit: cover;
      border-radius: 8px;
      background: var(--card-bg);
    }

    .carousel-card span {
      position: absolute;
      bottom: 5px;
      left: 5px;
      background: rgba(0,0,0,0.8);
      color: #fff;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    /* Movie Grid */
    .grid-container {
      padding: 0 16px;
    }

    #movieGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .card-info {
      padding: 6px;
    }

    .card-info h3 {
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .card-info span {
      font-size: 10px;
      color: #aaa;
    }

    /* Modal */
    #movieModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 300;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-content {
      background: var(--bg-color);
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 16px;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }

    #closeModal {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--card-bg);
      color: var(--text-color);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      z-index: 10;
    }

    /* Cast & Actor Scroll */
    .cast-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 5px;
      scrollbar-width: none;
    }
    .cast-scroll::-webkit-scrollbar { display: none; }

    .cast-item {
      min-width: 60px;
      width: 60px;
      text-align: center;
    }

    .cast-item img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--card-bg);
    }

    .cast-item span {
      font-size: 9px;
      display: block;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-left">
      <button id="hamburgerBtn">&#9776;</button>
      <div class="logo">KIOSHFLEX</div>
    </div>
    <div class="nav-right">
      <button id="watchlistNavBtn" class="nav-btn">Watchlist</button>
      <button id="themeToggleBtn" class="nav-btn">Theme</button>
    </div>
  </header>

  <div id="sidebarOverlay"></div>
  <div id="sidebar">
    <div class="sidebar-header">
      <h3 style="font-size: 16px;">Menu & Filters</h3>
      <button id="closeSidebar">&times;</button>
    </div>

    <div class="type-switch">
      <button id="btnMovies" class="type-btn active" data-type="movie">Movies</button>
      <button id="btnTV" class="type-btn" data-type="tv">TV Series</button>
    </div>

    <div class="filter-group">
      <label>Genre</label>
      <select id="genreSelect">
        <option value="">All Genres</option>
        <option value="28">Action</option>
        <option value="12">Adventure</option>
        <option value="16">Animation</option>
        <option value="35">Comedy</option>
        <option value="80">Crime</option>
        <option value="18">Drama</option>
        <option value="14">Fantasy</option>
        <option value="27">Horror</option>
        <option value="9648">Mystery</option>
        <option value="10749">Romance</option>
        <option value="878">Sci-Fi</option>
        <option value="53">Thriller</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Language</label>
      <select id="languageSelect">
        <option value="">All Languages</option>
        <option value="en">English</option>
        <option value="ko">Korean</option>
        <option value="ja">Japanese</option>
        <option value="es">Spanish</option>
        <option value="zh">Chinese</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Sort By</label>
      <select id="sortSelect">
        <option value="popularity.desc">Most Popular</option>
        <option value="vote_average.desc">Highest Rated</option>
        <option value="primary_release_date.desc">Latest Release</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Year</label>
      <select id="yearSelect">
        <option value="">All Years</option>
        <option value="2026">2026</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
        <option value="2023">2023</option>
        <option value="2022">2022</option>
        <option value="2020">2020</option>
      </select>
    </div>
  </div>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Search movies, TV shows...">
    <button id="searchBtn">Search</button>
  </div>

  <div id="heroBanner">
    <div class="hero-content">
      <h2 id="heroTitle">Loading Featured...</h2>
      <button id="heroPlayBtn">▶ Play</button>
    </div>
  </div>

  <div id="continueSection" class="section-container" style="display: none;">
    <h3 class="section-title">Continue Watching</h3>
    <div id="continueCarousel" class="carousel"></div>
  </div>

  <div id="carouselSection" class="section-container">
    <h3 class="section-title">Trending Top 10</h3>
    <div id="top10Carousel" class="carousel"></div>
  </div>

  <div class="section-container">
    <h3 id="sectionTitle" class="section-title">Explore Movies</h3>
    <div id="movieGrid" class="grid-container"></div>
  </div>

  <div id="movieModal">
    <div class="modal-content">
      <button id="closeModal">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
