<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIOSHFLEX - Movies & TV Shows</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --text-muted: #aaaaaa;
      --accent-color: #e50914;
      --border-color: #333333;
    }

    body.light-mode {
      --bg-color: #f4f4f4;
      --card-bg: #ffffff;
      --text-color: #121212;
      --text-muted: #666666;
      --border-color: #dddddd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background-color: var(--bg-color);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      color: var(--accent-color);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .header-btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .search-container {
      display: flex;
      padding: 12px 16px;
      gap: 8px;
      background: var(--bg-color);
    }

    .search-container input {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      color: var(--text-color);
      font-size: 13px;
      outline: none;
    }

    .search-container button {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 0 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }

    .type-switcher {
      display: flex;
      padding: 0 16px 12px 16px;
      gap: 8px;
    }

    .type-btn {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      font-size: 13px;
    }

    .type-btn.active {
      background: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    .filters-container {
      display: flex;
      gap: 8px;
      padding: 0 16px 12px 16px;
      overflow-x: auto;
    }

    .filter-select {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      padding: 12px 16px 8px 16px;
      color: var(--text-color);
    }

    .carousel-section {
      padding: 0 16px 16px 16px;
    }

    .carousel {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }

    .carousel::-webkit-scrollbar {
      display: none;
    }

    .carousel-card {
      min-width: 110px;
      max-width: 110px;
      position: relative;
      cursor: pointer;
    }

    .carousel-card span {
      position: absolute;
      bottom: -6px;
      left: -6px;
      background: var(--accent-color);
      color: #fff;
      font-size: 20px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 4px;
      z-index: 2;
    }

    .carousel-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 8px;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 0 16px 24px 16px;
    }

    @media (min-width: 600px) {
      .movie-grid {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .card img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
    }

    .card-info {
      padding: 8px;
    }

    .card-info h3 {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
      color: var(--text-color);
    }

    .card-info span {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Modal Layout */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      border-radius: 12px;
      padding: 16px;
      overflow-y: auto;
      position: relative;
      border: 1px solid var(--border-color);
    }

    .close-modal {
      position: absolute;
      top: 14px;
      right: 14px;
      background: var(--border-color);
      color: var(--text-color);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">KIOSHFLEX</div>
    <div class="header-actions">
      <button class="header-btn" id="watchlistNavBtn">Watchlist</button>
      <button class="header-btn" id="themeToggleBtn">Theme</button>
    </div>
  </header>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Search movies, TV shows...">
    <button id="searchBtn">Search</button>
  </div>

  <div class="type-switcher">
    <button class="type-btn active" id="btnMovies">Movies</button>
    <button class="type-btn" id="btnTV">TV Series</button>
  </div>

  <div class="filters-container">
    <select id="genreSelect" class="filter-select">
      <option value="">All Genres</option>
      <option value="28">Action</option>
      <option value="12">Adventure</option>
      <option value="16">Animation</option>
      <option value="35">Comedy</option>
      <option value="80">Crime</option>
      <option value="18">Drama</option>
      <option value="10751">Family</option>
      <option value="14">Fantasy</option>
      <option value="27">Horror</option>
      <option value="9648">Mystery</option>
      <option value="10749">Romance</option>
      <option value="878">Sci-Fi</option>
      <option value="53">Thriller</option>
    </select>

    <select id="sortBySelect" class="filter-select">
      <option value="popularity.desc">Most Popular</option>
      <option value="vote_average.desc">Highest Rated</option>
      <option value="primary_release_date.desc">Latest Release</option>
    </select>

    <select id="yearSelect" class="filter-select">
      <option value="">All Years</option>
      <option value="2026">2026</option>
      <option value="2025">2025</option>
      <option value="2024">2024</option>
      <option value="2023">2023</option>
      <option value="2022">2022</option>
    </select>
  </div>

  <div id="carouselSection" class="carousel-section">
    <div class="section-title">Trending Top 10</div>
    <div class="carousel" id="top10Carousel"></div>
  </div>

  <div class="section-title" id="sectionTitle">Trending Movies</div>
  <div class="movie-grid" id="movieGrid"></div>

  <!-- Modal -->
  <div class="modal" id="movieModal">
    <div class="modal-content">
      <button class="close-modal" id="closeModal">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
