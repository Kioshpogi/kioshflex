<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kioshflex Search UI</title>
  <style>
    /* General Styles */
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* Search Container Wrapper */
    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 550px;
      margin: 0 20px;
    }

    /* Search Bar Box */
    .search-bar-container {
      display: flex;
      align-items: center;
      background-color: #121212;
      border: 1px solid #27272a;
      border-radius: 9999px;
      padding: 10px 16px;
      transition: border-color 0.2s ease;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    .search-bar-container:focus-within {
      border-color: #dc2626;
    }

    /* Search Icon */
    .search-icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #a1a1aa;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-right: 12px;
      flex-shrink: 0;
    }

    /* Input Field */
    .search-input {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      width: 100%;
      font-size: 14px;
    }

    .search-input::placeholder {
      color: #71717a;
    }

    /* Search Button */
    .search-btn {
      background-color: #dc2626;
      color: #ffffff;
      border: none;
      border-radius: 9999px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-left: 8px;
      flex-shrink: 0;
    }

    .search-btn:hover {
      background-color: #b91c1c;
    }

    /* Search History Dropdown */
    .search-history {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 8px;
      background-color: #121212;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
      z-index: 50;
      display: none; /* Naka-hide by default */
    }

    .search-history.active {
      display: block; /* Lilitaw kapag na-click ang search bar */
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px 8px 4px;
    }

    .history-title {
      font-size: 11px;
      font-weight: 600;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0;
    }

    .clear-btn {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 11px;
      cursor: pointer;
      padding: 0;
    }

    .clear-btn:hover {
      color: #f87171;
    }

    /* History Tags List */
    .history-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .history-tag {
      background-color: rgba(39, 39, 42, 0.8);
      border: 1px solid rgba(63, 63, 70, 0.5);
      color: #d4d4d8;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }

    .history-tag:hover {
      background-color: #27272a;
    }
  </style>
</head>
<body>

  <div class="search-wrapper">
    <div class="search-bar-container" id="searchContainer">
      <svg class="search-icon" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input 
        type="text" 
        id="searchInput" 
        class="search-input" 
        placeholder="Search movies, TV shows..." 
        autocomplete="off"
      />
      <button class="search-btn">Search</button>
    </div>

    <div class="search-history" id="searchHistory">
      <div class="history-header">
        <p class="history-title">Recent Searches</p>
        <button class="clear-btn">Clear</button>
      </div>
      <div class="history-tags">
        <a href="#" class="history-tag">jhjj</a>
        <a href="#" class="history-tag">The Odyssey</a>
      </div>
    </div>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const searchHistory = document.getElementById('searchHistory');

    // Ipakita ang history kapag kinlik o na-focus ang search input
    searchInput.addEventListener('focus', () => {
      searchHistory.classList.add('active');
    });

    // Itago ang history kapag nag-click sa labas nito
    document.addEventListener('click', (event) => {
      const isClickInside = searchInput.contains(event.target) || searchHistory.contains(event.target);
      if (!isClickInside) {
        searchHistory.classList.remove('active');
      }
    });
  </script>

</body>
</html>
