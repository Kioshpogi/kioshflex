<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIOSHFLEX</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f0f0f;
      color: #fff;
      padding-bottom: 40px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: rgba(15, 15, 15, 0.9);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #e50914;
    }

    .menu-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .header-actions button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    .container {
      padding: 16px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #fff;
    }

    /* Grid para maging 3 columns at magkasya ang mas maliit na liquid glass cards */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      backdrop-filter: blur(8px);
    }

    .modal-content {
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    .modal-body {
      padding: 16px;
      font-size: 14px;
      color: #ccc;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <header>
    <button class="menu-btn">☰</button>
    <div class="logo">KIOSHFLEX</div>
    <div class="header-actions">
      <button>Watchlist</button>
      <button>Theme</button>
    </div>
  </header>

  <div class="container">
    <div class="section-title">Explore Movies</div>
    <div class="movie-grid" id="movieGrid"></div>
  </div>

  <div class="modal" id="mediaModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle" style="font-size: 16px; color: #fff;"></h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    const API_KEY = 'c752044810757a552bfd400e9debebe6'; // Palitan kung kinakailangan
    const IMG_PATH = 'https://image.tmdb.org/t/p/w500';
    const movieGrid = document.getElementById('movieGrid');
    const mediaModal = document.getElementById('mediaModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');

    async function fetchMovies() {
      try {
        const res = await fetch(`https://api.themoviedb.org/3/trending/all/day?api_key=${API_KEY}`);
        const data = await res.json();
        showMedia(data.results, 'movie');
      } catch (err) {
        console.error('Error fetching data:', err);
      }
    }

    function showMedia(items, type, append = false) {
      if (!append) movieGrid.innerHTML = '';
      items.forEach(item => {
        const title = item.title || item.name;
        const { poster_path, vote_average } = item;
        if (!poster_path) return;

        const card = document.createElement('div');
        card.classList.add('card');
        
        // Liquid Glass Styling + Mas Maliit na Sukat
        card.style.cssText = `
          background: rgba(255, 255, 255, 0.04);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 12px;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          cursor: pointer;
          width: 100%;
        `;

        card.innerHTML = `
          <div style="position: relative; width: 100%; height: 160px;">
            <img class="card-img" src="${IMG_PATH + poster_path}" alt="${title}" style="width:100%; height:100%; object-fit:cover;">
            <div class="hover-preview-container" style="position: absolute; inset: 0; background: #000; display: none; z-index: 3; overflow: hidden;"></div>
            <button class="quick-trailer-btn" data-id="${item.id}" data-type="${type}" title="Quick Trailer" style="position: absolute; top: 6px; right: 6px; background: rgba(20, 20, 20, 0.6); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 4; backdrop-filter: blur(6px);">
              <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
          </div>
          <div class="card-info" style="padding: 6px 8px;">
            <h3 style="font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; margin: 0 0 2px 0;">${title}</h3>
            <span style="font-size: 10px; color: #aaa;">★ ${vote_average ? vote_average.toFixed(1) : 'N/A'}</span>
          </div>
        `;

        // Hover Trailer Preview
        let hoverTimeout;
        const previewContainer = card.querySelector('.hover-preview-container');
        
        card.addEventListener('mouseenter', () => {
          hoverTimeout = setTimeout(async () => {
            try {
              const vidRes = await fetch(`https://api.themoviedb.org/3/${type}/${item.id}/videos?api_key=${API_KEY}`);
              const vidData = await vidRes.json();
              const teaser = vidData.results.find(v => (v.type === 'Trailer' || v.type === 'Teaser') && v.site === 'YouTube');
              if (teaser) {
                previewContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${teaser.key}?autoplay=1&mute=1&controls=0&loop=1&playlist=${teaser.key}" width="100%" height="100%" frameborder="0" style="position: absolute; top: 50%; left: 50%; width: 200%; height: 200%; transform: translate(-50%, -50%); pointer-events: none;"></iframe>`;
                previewContainer.style.display = 'block';
              }
            } catch (e) {}
          }, 600);
        });

        card.addEventListener('mouseleave', () => {
          clearTimeout(hoverTimeout);
          previewContainer.innerHTML = '';
          previewContainer.style.display = 'none';
        });

        card.addEventListener('click', () => openModal(item, type));
        movieGrid.appendChild(card);
      });
    }

    function openModal(item, type) {
      modalTitle.textContent = item.title || item.name;
      modalBody.innerHTML = `
        <p style="margin-bottom: 10px;">${item.overview || 'Wala pang deskripsyon para sa palabas na ito.'}</p>
        <p style="color: #aaa; font-size: 12px;">Petsa ng Paglabas: ${item.release_date || item.first_air_date || 'N/A'}</p>
      `;
      mediaModal.style.display = 'flex';
    }

    function closeModal() {
      mediaModal.style.display = 'none';
    }

    window.onclick = function(event) {
      if (event.target == mediaModal) {
        closeModal();
      }
    }

    fetchMovies();
  </script>
</body>
</html>
