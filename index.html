<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIOSHFLEX - Ultimate Streaming Experience</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #141414;
      --text-color: #ffffff;
      --text-muted: #b3b3b3;
      --accent-color: #e50914;
      --border-color: #222222;
    }

    body.light-mode {
      --bg-color: #f4f4f4;
      --card-bg: #ffffff;
      --text-color: #121212;
      --text-muted: #666666;
      --border-color: #dddddd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; transition: background 0.3s, color 0.3s; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background-color: rgba(0,0,0,0.85); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .hamburger-btn { background: none; border: none; color: var(--text-color); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .logo { color: var(--accent-color); font-size: 20px; font-weight: 900; letter-spacing: 1.5px; }
    .header-actions { display: flex; gap: 8px; }
    .header-btn { background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .header-btn:hover { border-color: var(--accent-color); }

    /* Sidebar Menu Drawer */
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 200; }
    .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100vh; background: var(--card-bg); border-right: 1px solid var(--border-color); z-index: 201; transition: left 0.3s ease; padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .sidebar.open { left: 0; }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; flex-shrink: 0; }
    .sidebar-title { font-size: 16px; font-weight: 800; color: var(--accent-color); }
    .close-sidebar { background: none; border: none; color: var(--text-color); font-size: 22px; cursor: pointer; }

    .sidebar-group { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
    .sidebar-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    
    .sidebar select { 
      width: 100%; 
      background: var(--bg-color); 
      color: var(--text-color); 
      border: 1px solid var(--border-color); 
      padding: 10px; 
      border-radius: 8px; 
      font-size: 12px; 
      outline: none; 
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg fill='%23aaaaaa' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 16px;
      padding-right: 30px;
    }
    
    .sidebar select option { background: var(--card-bg); color: var(--text-color); }
    .type-switcher { display: flex; gap: 8px; }
    .type-btn { flex: 1; text-align: center; font-weight: 600; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-muted); padding: 8px; border-radius: 8px; cursor: pointer; font-size: 11px; }
    .type-btn.active { background: var(--accent-color); border-color: var(--accent-color); color: #fff; font-weight: 700; }

    /* Search Bar */
    .search-container { display: flex; padding: 12px 20px; gap: 8px; background: var(--bg-color); border-bottom: 1px solid var(--border-color); }
    .search-container input { flex: 1; background: var(--card-bg); border: 1px solid var(--border-color); padding: 9px 12px; border-radius: 8px; color: var(--text-color); font-size: 12px; outline: none; }
    .search-container button { background: var(--accent-color); color: #fff; border: none; padding: 0 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 12px; box-shadow: 0 4px 15px rgba(229,9,20,0.4); }

    /* Hero Banner */
    .hero-banner { position: relative; width: 100%; height: 300px; background-size: cover; background-position: center; display: flex; align-items: flex-end; padding: 20px; margin-bottom: 16px; }
    .hero-banner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, var(--bg-color) 10%, rgba(0,0,0,0.2) 80%); }
    .hero-content { position: relative; z-index: 2; max-width: 100%; }
    .hero-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .hero-btn { background: var(--accent-color); color: #fff; border: none; padding: 7px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 11px; box-shadow: 0 4px 15px rgba(229,9,20,0.4); }

    .section-title { font-size: 15px; font-weight: 700; padding: 14px 20px 10px 20px; color: var(--text-color); }
    .carousel-section { padding: 0 20px 16px 20px; }
    .carousel { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
    .carousel::-webkit-scrollbar { display: none; }
    .carousel-card { min-width: 110px; max-width: 110px; position: relative; cursor: pointer; transition: transform 0.2s; }
    .carousel-card:hover { transform: scale(1.05); }
    .carousel-card span { position: absolute; bottom: -8px; left: -6px; background: var(--accent-color); color: #fff; font-size: 16px; font-weight: 900; padding: 2px 7px; border-radius: 6px; z-index: 2; }
    .carousel-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; }

    .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 20px 30px 20px; }
    @media (min-width: 600px) { .movie-grid { grid-template-columns: repeat(5, 1fr); } }

    .card { background: var(--card-bg); border-radius: 10px; overflow: hidden; cursor: pointer; border: 1px solid var(--border-color); display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; position: relative; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.6); border-color: #444; }
    .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
    .card-info { padding: 8px; }
    .card-info h3 { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; color: var(--text-color); }
    .card-info span { font-size: 10px; color: var(--text-muted); }
    
    .progress-bar { width: 100%; height: 4px; background: #333; position: absolute; bottom: 0; left: 0; }
    .progress-fill { height: 100%; background: var(--accent-color); width: 60%; }

    .cast-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; margin-top: 6px; }
    .cast-scroll::-webkit-scrollbar { display: none; }
    .cast-item { min-width: 50px; max-width: 50px; text-align: center; }
    .cast-item img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color); margin-bottom: 3px; }
    .cast-item span { font-size: 8px; color: var(--text-muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 1000; justify-content: center; align-items: center; padding: 16px; }
    .modal-content { background: var(--card-bg); width: 100%; max-width: 500px; max-height: 92vh; border-radius: 14px; padding: 18px; overflow-y: auto; position: relative; border: 1px solid var(--border-color); box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
    .close-modal { position: absolute; top: 14px; right: 14px; background: var(--border-color); color: var(--text-color); border: none; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .close-modal:hover { background: var(--accent-color); }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <button class="hamburger-btn" id="hamburgerBtn">&#9776;</button>
      <div class="logo">KIOSHFLEX</div>
    </div>
    <div class="header-actions">
      <button class="header-btn" id="watchlistNavBtn">Watchlist</button>
      <button class="header-btn" id="themeToggleBtn">Theme</button>
    </div>
  </header>

  <!-- Sidebar Drawer Menu -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Menu & Filters</div>
      <button class="close-sidebar" id="closeSidebar">&times;</button>
    </div>

    <div class="sidebar-group">
      <span class="sidebar-label">Category</span>
      <div class="type-switcher">
        <button class="type-btn active" id="btnMovies" data-type="movie">Movies</button>
        <button class="type-btn" id="btnTV" data-type="tv">TV Series</button>
      </div>
    </div>

    <div class="sidebar-group">
      <span class="sidebar-label">Genre</span>
      <select id="genreSelect">
        <option value="">All Genres</option>
        <option value="28">Action</option>
        <option value="12">Adventure</option>
        <option value="16">Animation</option>
        <option value="35">Comedy</option>
        <option value="80">Crime</option>
        <option value="18">Drama</option>
        <option value="27">Horror</option>
        <option value="10749">Romance</option>
        <option value="878">Sci-Fi</option>
      </select>
    </div>

    <div class="sidebar-group">
      <span class="sidebar-label">Language</span>
      <select id="languageSelect">
        <option value="">All Languages</option>
        <option value="en">English</option>
        <option value="ko">Korean</option>
        <option value="ja">Japanese</option>
        <option value="tl">Tagalog</option>
      </select>
    </div>

    <div class="sidebar-group">
      <span class="sidebar-label">Sort By</span>
      <select id="sortSelect">
        <option value="popularity.desc">Most Popular</option>
        <option value="vote_average.desc">Highest Rated</option>
        <option value="primary_release_date.desc">Latest Release</option>
      </select>
    </div>

    <div class="sidebar-group">
      <span class="sidebar-label">Release Year</span>
      <select id="yearSelect">
        <option value="">All Years</option>
        <option value="2026">2026</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
      </select>
    </div>
  </div>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Search movies, TV shows...">
    <button id="searchBtn">Search</button>
  </div>

  <div id="heroBanner" class="hero-banner" style="display:none;">
    <div class="hero-content">
      <div id="heroTitle" class="hero-title">Featured Title</div>
      <button id="heroPlayBtn" class="hero-btn">▶ Watch Now</button>
    </div>
  </div>

  <div id="continueSection" class="carousel-section" style="display:none; margin-top: 14px;">
    <div class="section-title">Continue Watching</div>
    <div class="carousel" id="continueCarousel"></div>
  </div>

  <div id="carouselSection" class="carousel-section" style="margin-top: 14px;">
    <div class="section-title">Trending Top 10</div>
    <div class="carousel" id="top10Carousel"></div>
  </div>

  <div class="section-title" id="sectionTitle">Trending Movies</div>
  <div class="movie-grid" id="movieGrid"></div>

  <div class="modal" id="movieModal">
    <div class="modal-content">
      <button class="close-modal" id="closeModal">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
